# Watcher IDS — database backup settings
# Used by the daily watcher-backup.timer and by `sudo watcher --backup-now`.
# Schedule: sudo systemctl edit watcher-backup.timer   (default: daily ~02:30)
# Disable:  sudo systemctl disable --now watcher-backup.timer

# Where backups are written. Must not be inside /var/lib/watcher.
# If you change it, also allow the service to write there:
#   sudo systemctl edit watcher-backup.service  →  [Service] ReadWritePaths=<dir>
BACKUP_DIR=/var/backups/watcher

# Number of complete backups to keep. The oldest is removed only after a new
# backup has succeeded, so peak disk use is (BACKUP_KEEP + 1) × database size.
BACKUP_KEEP=2

# Which databases to back up (config = users, webhooks, threat intel,
# suppression rules, settings; events = alerts/flows/HTTP; dns = DNS).
# config is small and always worth keeping; events/dns can be very large.
BACKUP_DATABASES="config events dns"

# Verify each copy with SQLite's quick_check (reads the whole copy once).
BACKUP_VERIFY=yes

# Skip any database whose copy would leave less than this share of the
# filesystem free (protects Suricata and Watcher from a full disk).
# config.db (tiny) is still backed up while its copy is <= 1/10 of free space.
BACKUP_MIN_FREE_PERCENT=10

# NOTE: backups on the same disk protect against corruption, mistakes and
# bad upgrades — not against losing the disk or the server. Copy the newest
# backup elsewhere regularly (e.g. rsync /var/backups/watcher/ to another host).
